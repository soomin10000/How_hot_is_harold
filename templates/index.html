<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How Hot is Harold?</title>
  <style>
    /* Harold is a two-bar electric fire. The page is the room he sits in:
       bakelite browns that warm up when he's on and cool to slate when he's off. */
    :root {
      --bakelite-900: #16100b;
      --bakelite-700: #241a11;
      --ember:    #ff7b33;
      --filament: #ffc98a;
      --cream:    #f2e5d0;
      --ash:      #9a8f80;
      --frost:    #9fd7ff;
      --coal:     #463d33;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, 'Segoe UI', sans-serif;
      background: var(--bakelite-900);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      transition: background 1.2s ease;
      overflow-x: hidden;
    }
    /* the room takes Harold's light */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 90% 60% at 50% 78%,
                  rgba(255, 123, 51, 0.16), transparent 65%);
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    body.is-warm::before { opacity: 1; }
    body.is-frost::before {
      background: radial-gradient(ellipse 90% 60% at 50% 78%,
                  rgba(159, 215, 255, 0.10), transparent 65%);
      opacity: 1;
    }
    body.is-cold { background: #131416; }
    body.is-cold .wordmark, body.is-cold .temp-val { color: var(--ash); }
    body.is-cold .temp-val { text-shadow: none; }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--ash);
    }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.2rem, 6vw, 3rem);
      color: var(--cream);
      margin: 0.1rem 0 1.4rem;
      transition: color 1.2s ease;
    }
    .wordmark .q { color: var(--ember); }

    .temp-val {
      font-size: clamp(4.5rem, 16vw, 6.5rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--filament);
      text-shadow: 0 0 34px rgba(255, 123, 51, 0.35);
      transition: color 1.2s ease, text-shadow 1.2s ease;
    }
    .temp-val .unit { font-size: 0.35em; font-weight: 600; color: var(--ash); vertical-align: 0.9em; margin-left: 0.08em; }
    .statusline {
      margin: 0.7rem 0 1.6rem;
      font-size: 0.95rem;
      color: var(--ash);
      min-height: 1.3em;
      text-align: center;
    }
    .statusline strong { color: var(--cream); font-weight: 600; }
    .statusline.err { color: #e88; }

    .fire { position: relative; }
    .fire svg { display: block; width: min(400px, 88vw); height: auto; }

    /* bars: cold coal by default; lit classes set the glow */
    .bar { fill: var(--coal); transition: fill 0.8s ease; }
    .bar-lit { fill: url(#barGrad); }
    .glow { opacity: 0; transition: opacity 0.8s ease; }
    .lit-1 .bar-2, .lit-2 .bar-1, .lit-2 .bar-2 { fill: url(#barGrad); }
    .lit-1 .glow-2, .lit-2 .glow-1, .lit-2 .glow-2 { opacity: 1; }
    .lit-frost .bar-1, .lit-frost .bar-2 { fill: url(#frostGrad); }
    .lit-frost .glow-1, .lit-frost .glow-2 { opacity: 0.45; }

    /* animate only lit glows — an always-on animation would override opacity:0 when off */
    .lit-1 .glow-2, .lit-2 .glow-1, .lit-2 .glow-2 {
      animation: breathe 2.6s ease-in-out infinite alternate;
    }
    .lit-2 .glow-2 { animation-delay: -1.3s; }
    @keyframes breathe {
      from { opacity: 0.75; }
      to   { opacity: 1; }
    }
    .lit-frost .glow { fill: url(#frostGlowGrad); }
    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
    }

    .pilot { fill: #52483d; transition: fill 0.8s ease; }
    .pilot-on { fill: #7ee08a; }

    .facts {
      display: flex;
      gap: 2.2rem;
      margin-top: 1.9rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .fact { text-align: center; }
    .fact .k {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ash);
      margin-bottom: 0.3rem;
    }
    .fact .v { font-size: 1.15rem; font-weight: 600; color: var(--cream); font-variant-numeric: tabular-nums; }
    .fact .age { font-size: 0.66rem; color: #6d6357; margin-top: 0.25rem; }

    .foot {
      margin-top: 2.2rem;
      font-size: 0.72rem;
      color: #6d6357;
      text-align: center;
    }
    .foot a { color: inherit; }
    .foot a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 2px; }
  </style>
</head>
<body>
  <p class="eyebrow">Tuya heater &middot; 192.168.1.237</p>
  <h1 class="wordmark">How hot is Harold<span class="q">?</span></h1>

  <div class="temp-val" id="temp">—</div>
  <p class="statusline" id="statusline">Asking Harold…</p>

  <div class="fire">
    <svg id="fireSvg" viewBox="0 0 400 250" role="img" aria-label="Electric bar fire showing Harold's state">
      <defs>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#33261a"/>
          <stop offset="1" stop-color="#1c140d"/>
        </linearGradient>
        <linearGradient id="reflGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#413122"/>
          <stop offset="1" stop-color="#241a11"/>
        </linearGradient>
        <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#ff6a1f"/>
          <stop offset="0.5" stop-color="#ffc98a"/>
          <stop offset="1"   stop-color="#ff6a1f"/>
        </linearGradient>
        <linearGradient id="frostGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#5fa8d8"/>
          <stop offset="0.5" stop-color="#cdeaff"/>
          <stop offset="1"   stop-color="#5fa8d8"/>
        </linearGradient>
        <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#ff8c3f" stop-opacity="0.55"/>
          <stop offset="1" stop-color="#ff8c3f" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="frostGlowGrad" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#9fd7ff" stop-opacity="0.4"/>
          <stop offset="1" stop-color="#9fd7ff" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- carry handle -->
      <path d="M 150 32 Q 200 6 250 32" fill="none" stroke="#4a3823" stroke-width="7" stroke-linecap="round"/>

      <!-- body -->
      <rect x="30" y="34" width="340" height="176" rx="20" fill="url(#bodyGrad)" stroke="#4a3823" stroke-width="2"/>
      <!-- reflector cavity -->
      <rect x="52" y="54" width="296" height="118" rx="12" fill="url(#reflGrad)"/>

      <!-- element glows (behind the guard) -->
      <ellipse class="glow glow-1" cx="200" cy="92"  rx="150" ry="26" fill="url(#glowGrad)"/>
      <ellipse class="glow glow-2" cx="200" cy="136" rx="150" ry="26" fill="url(#glowGrad)"/>

      <!-- heating bars -->
      <rect class="bar bar-1" x="66" y="86"  width="268" height="11" rx="5.5"/>
      <rect class="bar bar-2" x="66" y="130" width="268" height="11" rx="5.5"/>
      <!-- element end caps -->
      <rect x="58" y="82"  width="12" height="19" rx="3" fill="#3a2c1c"/>
      <rect x="330" y="82" width="12" height="19" rx="3" fill="#3a2c1c"/>
      <rect x="58" y="126"  width="12" height="19" rx="3" fill="#3a2c1c"/>
      <rect x="330" y="126" width="12" height="19" rx="3" fill="#3a2c1c"/>

      <!-- guard grille -->
      <g stroke="#0e0a06" stroke-width="3" opacity="0.55">
        <line x1="95"  y1="56" x2="95"  y2="170"/>
        <line x1="148" y1="56" x2="148" y2="170"/>
        <line x1="200" y1="56" x2="200" y2="170"/>
        <line x1="252" y1="56" x2="252" y2="170"/>
        <line x1="305" y1="56" x2="305" y2="170"/>
      </g>

      <!-- kick plate with pilot light -->
      <rect x="52" y="180" width="296" height="18" rx="6" fill="#2b2018"/>
      <circle class="pilot" id="pilot" cx="330" cy="189" r="4.5"/>

      <!-- feet -->
      <rect x="56"  y="210" width="46" height="12" rx="6" fill="#2b2018"/>
      <rect x="298" y="210" width="46" height="12" rx="6" fill="#2b2018"/>
    </svg>
  </div>

  <div class="facts" id="facts" hidden>
    <div class="fact"><div class="k">Power</div>    <div class="v" id="f-power">—</div><div class="age" id="a-power"></div></div>
    <div class="fact"><div class="k">Set to</div>   <div class="v" id="f-set">—</div>  <div class="age" id="a-set"></div></div>
    <div class="fact"><div class="k">Mode</div>     <div class="v" id="f-mode">—</div> <div class="age" id="a-mode"></div></div>
    <div class="fact"><div class="k">Timer</div>    <div class="v" id="f-timer">—</div><div class="age" id="a-timer"></div></div>
  </div>

  <p class="foot"><span id="updated">connecting…</span> &middot; refreshes every 5s &middot; <a href="/api/status">JSON</a></p>

  <script>
    const MODE_LABELS = { low: 'Low', high: 'High', af: 'Anti-frost' };

    function fmtAge(ms) {
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 60) return 'changed just now';
      if (s < 3600) return 'changed ' + Math.floor(s / 60) + 'm ago';
      if (s < 86400) return 'changed ' + Math.floor(s / 3600) + 'h ago';
      return 'changed ' + Math.floor(s / 86400) + 'd ago';
    }

    function setText(id, text) { document.getElementById(id).textContent = text; }

    function render(state) {
      const dps = state.dps || {};
      const shadow = state.shadow || {};
      const hasDps = Object.keys(dps).length > 0;
      const body = document.body;
      const svg = document.getElementById('fireSvg');
      const status = document.getElementById('statusline');

      if (!hasDps) {
        body.className = 'is-cold';
        svg.setAttribute('class', '');
        document.getElementById('pilot').setAttribute('class', 'pilot');
        setText('temp', '?');
        status.className = 'statusline err';
        status.textContent = state.Error ? 'Can’t reach Harold — ' + state.Error : 'Can’t reach Harold';
        if (state.ts) {
          const s = Math.round(Date.now() / 1000 - state.ts);
          setText('updated', 'last tried ' + (s < 6 ? 'just now' : s + 's ago'));
        }
        return;
      }

      const power = !!dps['1'];
      const setTemp = dps['2'];
      const roomTemp = dps['3'];
      const mode = dps['4'];
      const timer = dps['12'];

      // the fire: which bars glow
      let barClass = '', bodyClass = 'is-cold';
      if (power && mode === 'af') { barClass = 'lit-frost'; bodyClass = 'is-frost'; }
      else if (power && mode === 'high') { barClass = 'lit-2'; bodyClass = 'is-warm'; }
      else if (power) { barClass = 'lit-1'; bodyClass = 'is-warm'; }
      svg.setAttribute('class', barClass);
      body.className = bodyClass;
      document.getElementById('pilot').setAttribute('class', power ? 'pilot pilot-on' : 'pilot');

      // headline temperature
      const tempEl = document.getElementById('temp');
      tempEl.innerHTML = '';
      tempEl.append(roomTemp != null ? String(roomTemp) : '—');
      const unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = '°C';
      tempEl.appendChild(unit);

      // one honest sentence about what Harold is doing
      status.className = 'statusline';
      if (!power) {
        status.innerHTML = 'Off — the room is on its own';
      } else if (mode === 'af') {
        status.innerHTML = 'Anti-frost watch — stepping in if the room nears freezing';
      } else if (roomTemp != null && setTemp != null && roomTemp >= setTemp) {
        status.innerHTML = 'At temperature — set to <strong>' + setTemp + '°</strong>, holding back';
      } else if (setTemp != null) {
        status.innerHTML = 'Warming the room to <strong>' + setTemp + '°</strong>';
      } else {
        status.textContent = 'On';
      }
      if (state.Error) {
        status.className = 'statusline err';
        status.textContent = 'Last word from Harold below — now unreachable: ' + state.Error;
      }

      // facts strip with per-property change ages from the cloud shadow
      document.getElementById('facts').hidden = false;
      setText('f-power', power ? 'On' : 'Off');
      setText('f-set', setTemp != null ? setTemp + '°C' : '—');
      setText('f-mode', MODE_LABELS[mode] || mode || '—');
      setText('f-timer', timer ? timer + 'h' : 'Not set');
      setText('a-power', shadow.Power ? fmtAge(shadow.Power) : '');
      setText('a-set',   shadow.TempSet ? fmtAge(shadow.TempSet) : '');
      setText('a-mode',  shadow.Mode ? fmtAge(shadow.Mode) : '');
      setText('a-timer', '');

      if (state.ts) {
        const s = Math.round(Date.now() / 1000 - state.ts);
        setText('updated', s < 6 ? 'live' : 'last heard ' + s + 's ago');
      }
    }

    async function poll() {
      try {
        const r = await fetch('/api/status');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        render(await r.json());
      } catch (_) {
        render({ Error: 'dashboard server unreachable' });
      }
    }

    poll();
    setInterval(poll, 5000);
  </script>
</body>
</html>
